# ------------------------------------------------------------------
# Configuracion del Proyecto Final de Calculo II
# ------------------------------------------------------------------
# Este archivo se lee al arrancar. Si se borra o si un valor no es
# valido, la aplicacion usa los valores por defecto de Constantes.java.

# Puerto en que escucha el servidor.
# Se puede cambiar aqui, o pasarlo como argumento:  java -jar calculo2.jar 9090
servidor.puerto=8080

# Carpeta dentro del jar donde viven el HTML, el CSS y el JavaScript.
servidor.rutaEstatica=/static

# Numero de subintervalos que trae el formulario por omision.
calculo.particionesPorDefecto=1000

# Error maximo admitido por el integrador adaptativo.
calculo.tolerancia=1e-10

# Decimales que se muestran en los resultados.
calculo.decimales=6
